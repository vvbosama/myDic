services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expression_network}
      POSTGRES_USER: ${POSTGRES_USER:-expression}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expression}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - expression_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expression} -d ${POSTGRES_DB:-expression_network}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-expression}:${POSTGRES_PASSWORD:-expression}@db:5432/${POSTGRES_DB:-expression_network}
      DEV_USER_ID: ${DEV_USER_ID:-00000000-0000-0000-0000-000000000001}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:10086,http://127.0.0.1:10086}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  expression_postgres_data:

